name: volunteer_app
description: M7 Volunteer Logistics Mobile App
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  provider: ^6.1.0
  
  # Network
  dio: ^5.4.0
  socket_io_client: ^2.0.3
  
  # Local Storage
  sqflite: ^2.3.0
  path_provider: ^2.1.1
  shared_preferences: ^2.2.2
  
  # Location & Maps
  geolocator: ^10.1.0
  permission_handler: ^11.1.0
  google_maps_flutter: ^2.5.0
  flutter_polyline_points: ^2.0.1
  
  # QR Code Scanning
  mobile_scanner: ^3.5.5
  
  # Firebase (commented out for Windows desktop testing)
  # firebase_core: ^2.24.2
  # firebase_auth: ^4.16.0
  # firebase_messaging: ^14.7.9
  
  # Image Handling
  image_picker: ^1.0.5
  
  # UI Components
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  lottie: ^2.7.0
  
  # Utilities
  intl: ^0.18.1
  uuid: ^4.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
