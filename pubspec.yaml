name: food_rescue_ngo
description: Food Rescue Platform - NGO Claiming Screen
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # HTTP client for API calls
  http: ^1.1.0
  
  # QR code generation
  qr_flutter: ^4.1.0
  
  # Date formatting
  intl: ^0.18.1
  
  # Local storage for token
  shared_preferences: ^2.2.2
  
  # Material icons
  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
